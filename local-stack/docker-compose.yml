services:
  postgres:
    image: postgres:16-alpine
    container_name: nonsawang-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nonsawang
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_local_db_password}
      TZ: Asia/Bangkok
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: nonsawang-local-postgrest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-change_this_local_db_password}@postgres:5432/nonsawang
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_DB_MAX_ROWS: 1000

  rest-gateway:
    image: nginx:1.27-alpine
    container_name: nonsawang-local-gateway
    restart: unless-stopped
    depends_on:
      - postgrest
    ports:
      - "127.0.0.1:54321:80"
    volumes:
      - ./nginx-postgrest.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
